services:
  architect:
    build: .
    container_name: architect
    user: "${UID:-1000}:1000"  # Runs as YOUR user
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - .:/app
    stdin_open: true
    tty: true

  coder:
