name: SeaPath Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-rust-sim:
    name: Build Rust Simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seapath_sim
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            seapath_sim/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('seapath_sim/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Simulator Test Suite
        run: cargo test --verbose

      - name: Build Simulator Binary
        run: cargo build --release

  build-cpp-core:
    name: build-cpp-core (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Force Environment Node Runtime Update
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Cache for GoogleTest Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ matrix.os }}-${{ matrix.build_type }}-cmake-${{ github.sha }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.build_type }}-cmake-

      - name: Configure CMake Engine
        run: |
          cd seapath_core
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ..

      - name: Compile C++ Targets
        run: |
          cd seapath_core/build
          cmake --build . --config ${{ matrix.build_type }}

      - name: Execute C++ GTest Runner
        run: |
          cd seapath_core/build
          ./tests/seapath_tests