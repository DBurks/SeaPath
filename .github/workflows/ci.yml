name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      # Install lcov only on Ubuntu for the Debug coverage pass
      - name: Install LCOV (Ubuntu Debug only)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Create Build Directory
        run: mkdir build

      # Dynamically inject coverage flags only for Ubuntu Debug runs
      - name: Configure CMake
        run: |
          cd build
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.build_type }}" = "Debug" ]; then
            cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          else
            cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      - name: Build
        run: cd build && cmake --build . --config ${{ matrix.build_type }}

      # Changed: Run from 'build' root directory so ctest resolves paths correctly across OS platforms
      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C ${{ matrix.build_type }}

      # Process and extract lcov metrics safely, ignoring GTest macro quirks
      - name: Generate and Filter Coverage Report (Ubuntu Debug only)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
        run: |
          # Capture coverage directly by targeting the build directory and anchoring to workspace root
          lcov --directory build/ --base-directory . --capture --output-file build/coverage.info --ignore-errors mismatch
          
          # Filter out system and test files
          lcov --remove build/coverage.info '/usr/*' '*/_deps/*' '*/tests/*' --output-file build/coverage.cleaned.info --ignore-errors mismatch
          
          # Generate the HTML dashboard
          genhtml build/coverage.cleaned.info --output-directory build/coverage_report

      # Zip and upload the HTML dashboard directly to your GitHub Action run panel
      - name: Upload Coverage Artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: seapath-lcov-report
          path: build/coverage_report/