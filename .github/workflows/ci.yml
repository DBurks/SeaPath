name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: C++ Core Control & Navigation Matrix
  # ==========================================
  build-cpp-core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]

    defaults:
      run:
        working-directory: seapath_core

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install LCOV (Ubuntu Debug only)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Create Build Directory
        run: mkdir build

      - name: Configure CMake
        run: |
          cd build
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.build_type }}" = "Debug" ]; then
            cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          else
            cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      - name: Build
        run: cd build && cmake --build . --config ${{ matrix.build_type }}

      - name: Run Tests
        run: |
          cd build
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.build_type }}" = "Debug" ]; then
            ./tests/seapath_tests
          else
            ctest --output-on-failure -C ${{ matrix.build_type }}
          fi

      - name: Generate and Filter Coverage Report (Ubuntu Debug only)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
        run: |
          cd build
          lcov --directory . --base-directory .. --capture --output-file coverage.info --ignore-errors mismatch,unused
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' --output-file coverage.cleaned.info --ignore-errors mismatch,unused
          genhtml coverage.cleaned.info --output-directory coverage_report

      - name: Upload Coverage Artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: seapath-lcov-report
          path: seapath_core/build/coverage_report/

  # ==========================================
  # JOB 2: Rust Physics & Plant Simulator
  # ==========================================
  build-rust-sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seapath_sim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Use native GitHub caching to make subsequent simulator passes lightning fast
      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: seapath_sim -> target

      - name: Verify Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy -- -D warnings

      - name: Run Simulation Test Suite
        run: cargo test